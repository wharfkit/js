name: Linting

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - run: bun install
      - run: bun lint
