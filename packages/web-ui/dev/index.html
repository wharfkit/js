<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebUI Dev</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            background: #f5f5f5;
            color: #333;
        }
        h1 { margin-bottom: 8px; font-size: 24px; }
        p.subtitle { color: #666; margin-bottom: 32px; font-size: 14px; }
        .section { margin-bottom: 24px; }
        .section h2 { font-size: 14px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        button:hover { border-color: #3b82f6; color: #3b82f6; }
        button.primary { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        button.primary:hover { background: #2563eb; }
        .session-info { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
        .sk-status { font-size: 12px; margin-top: 8px; }
        .sk-status.active { color: #10b981; }
        hr { border: none; border-top: 1px solid #ddd; margin: 32px 0; }
        .log { margin-top: 24px; padding: 16px; background: #1a1a2e; color: #94a3b8; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
        .log-entry { padding: 2px 0; }
        .log-entry.success { color: #10b981; }
        .log-entry.error { color: #ef4444; }
    </style>
</head>
<body>
    <h1>WebUI Dev</h1>
    <p class="subtitle">Development environment for @wharfkit/web-ui</p>

    <div class="section">
        <h2>SessionKit (Real Plugins)</h2>
        <div id="sk-logged-out">
            <div class="btn-group">
                <button class="primary" id="btn-sk-login">Login</button>
            </div>
        </div>
        <div id="sk-logged-in" style="display:none;">
            <p class="session-info" id="sk-session-info"></p>
            <div class="btn-group">
                <button class="primary" id="btn-sk-transact">Transact</button>
                <button id="btn-sk-setup-key">Setup Session Key</button>
                <button id="btn-sk-remove-key" style="display:none;">Remove Session Key</button>
                <button id="btn-sk-logout">Logout</button>
            </div>
            <p class="sk-status" id="sk-key-status"></p>
        </div>
    </div>

    <hr />

    <div class="section">
        <h2>Mock Flows</h2>
        <div class="btn-group">
            <button id="btn-mock-login">Login</button>
            <button id="btn-mock-transact">Transact</button>
            <button id="btn-mock-error">Error</button>
        </div>
    </div>

    <div class="section">
        <h2>Mock Prompts</h2>
        <div class="btn-group">
            <button id="btn-prompt-fee">Resource Fee</button>
            <button id="btn-prompt-finality">Finality</button>
            <button id="btn-prompt-anchor">Anchor Sign</button>
            <button id="btn-prompt-anchor-qr">Anchor QR</button>
        </div>
    </div>

    <div class="section">
        <h2>Mock Session Keys</h2>
        <div class="btn-group">
            <button id="btn-sk-consent">Consent</button>
            <button id="btn-sk-consent-all">Consent (All)</button>
            <button id="btn-sk-conflict">Conflict</button>
            <button id="btn-sk-mismatch">Mismatch</button>
            <button id="btn-sk-remove">Remove</button>
        </div>
    </div>

    <hr />

    <div class="section">
        <h2>Theme</h2>
        <div class="btn-group">
            <button id="btn-light">Light</button>
            <button id="btn-dark">Dark</button>
            <button id="btn-auto">Auto</button>
        </div>
    </div>

    <div class="log" id="log"></div>

    <script type="module" src="./main.ts"></script>
</body>
</html>
