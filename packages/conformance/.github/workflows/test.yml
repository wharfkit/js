name: Tests
on: push
jobs:
    clang-format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: jidicula/clang-format-action@v4.11.0
              with:
                  clang-format-version: '16'
                  check-path: src
            - uses: jidicula/clang-format-action@v4.11.0
              with:
                  clang-format-version: '16'
                  check-path: include/conformance
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v1
            - uses: docker/setup-buildx-action@v3
              with:
                  install: true
            - uses: actions/cache@v4
              with:
                  path: /tmp/.buildx-cache
                  key: cdt-image-${{ hashFiles('docker/Dockerfile', '.env') }}
            - run: make node_modules
            - run: make jscheck
            - run: make build/production DOCKER_BUILD_FLAGS="--load --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache,mode=max"
            - name: Committed artifacts match the build
              run: git diff --exit-code -- build/conformance.wasm build/conformance.abi
            - run: make test
